name: Сборка и проверка Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Проверка переводов
        run: python tools/check-translations.py
      - name: Инструменты сборки
        run: python -m pip install cmake ninja
      - name: Последний стабильный LLVM-MinGW
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/fetch-llvm-mingw.py
      - name: Сборка Clang
        run: python tools/build-llvm.py ${{ matrix.arch }} --build-dir build/windows-${{ matrix.arch }} --tests
      - name: Совместимость с KiTTY
        if: matrix.arch != 'arm64'
        run: |
          python test/run_kittyng.py build/windows-${{ matrix.arch }}/test_kittyng.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python test/run_kittyng_legacy.py build/windows-${{ matrix.arch }}/test_kittyng_legacy.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./build/windows-${{ matrix.arch }}/test_host_strfoo.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./build/windows-${{ matrix.arch }}/test_bpp.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PUTTY_TESTCRYPT='"'+(Resolve-Path build/windows-${{ matrix.arch }}/testcrypt.exe).Path+'"'
          python test/cryptsuite.py
      - name: Локальный SSH-сервер для тестов
        if: matrix.arch != 'arm64'
        run: python -m pip install paramiko
      - name: Проверка сохранённого пароля и переподключения
        if: matrix.arch != 'arm64'
        run: |
          python test/ssh_saved_password.py build/windows-${{ matrix.arch }}/kitty-ng.exe build/windows-${{ matrix.arch }}/plink.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python test/ssh_saved_password.py --reconnect build/windows-${{ matrix.arch }}/kitty-ng.exe
      - name: Архив выпуска
        run: python tools/package-release.py ${{ matrix.arch }} build/windows-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: kitty-ng-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
